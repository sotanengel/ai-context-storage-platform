name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.2"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras
        env:
          UV_INDEX_FLATT_TECH_PASSWORD: ${{ secrets.TAKUMI_GUARD_TOKEN }}

      - name: Run linters
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run type checker
        run: uv run mypy

      - name: Run tests
        run: uv run pytest

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        env:
          DOCKER_BUILDKIT: 1
          UV_INDEX_FLATT_TECH_PASSWORD: ${{ secrets.TAKUMI_GUARD_TOKEN }}
        run: |
          docker build \
            --secret id=takumi_guard_token,env=UV_INDEX_FLATT_TECH_PASSWORD \
            -t formaforge:ci .
